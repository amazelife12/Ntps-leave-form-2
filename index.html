<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>楠梓國小班級請假單</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 聯絡簿式單欄表單。順序固定：選類型、填資訊、傳給老師，外部表單放最後，家長不必再回到本頁。 */
:root {
  --paper: #f3f6fa;
  --card: #ffffff;
  --ink: #17233a;
  --muted: #5b6b85;
  --rule: #d3dcea;
  --accent: #1f4e9c;
  --accent-ink: #ffffff;
  --accent-soft: #e2ebf8;
  --stamp: #c8372d;
  --ok: #1d7a4b;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-display: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1626; --card: #17213a; --ink: #e7edf8; --muted: #9aaac6; --rule: #2a3a5c;
    --accent: #7fa8ee; --accent-ink: #0f1626; --accent-soft: #1d2d52; --stamp: #ff7a6e;
    --ok: #6fd3a0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1626; --card: #17213a; --ink: #e7edf8; --muted: #9aaac6; --rule: #2a3a5c;
  --accent: #7fa8ee; --accent-ink: #0f1626; --accent-soft: #1d2d52; --stamp: #ff7a6e;
  --ok: #6fd3a0; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

header {
  padding: 22px 18px 18px;
  border-radius: var(--radius);
  background:
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px),
    var(--card);
  border: 1px solid var(--rule);
}
header .kicker { margin: 0; font-size: 13px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
header h1 { margin: 4px 0 6px; font-family: var(--font-display); font-size: 34px; line-height: 1.2; font-weight: 900; letter-spacing: .04em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 15px; background: var(--card); display: inline; padding: 0 4px 0 0; }

section { display: flex; flex-direction: column; gap: 14px; }
h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .04em; scroll-margin-top: 12px; }
.sub { margin: -6px 0 0; color: var(--muted); font-size: 14px; }

fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
legend { padding: 0; font-size: 14px; color: var(--muted); font-weight: 500; margin-bottom: 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg3 { grid-template-columns: repeat(3, 1fr); }
.seg3 span { flex-direction: column; gap: 2px; }
.seg3 .ico { margin: 0; }
.field textarea.need { border-color: var(--stamp); }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span {
  display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 8px 10px;
  border: 1.5px solid var(--rule); background: var(--card); border-radius: var(--radius);
  font-weight: 500; text-align: center; line-height: 1.35;
}
.seg .ico { font-weight: 400; font-size: 24px; line-height: 1; margin-right: 8px; flex: none; }
.seg input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

.count { display: inline-block; margin-left: 8px; padding: 1px 10px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 700; vertical-align: 2px; }
.steps { margin: 0; padding: 14px 16px 14px 38px; background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); display: flex; flex-direction: column; gap: 8px; }
.steps li { padding-left: 4px; }
.steps li::marker { color: var(--accent); font-weight: 700; }
.steps li.star { list-style: none; position: relative; }
.steps li.star .mk { position: absolute; left: -1.25em; top: 0; color: var(--stamp); font-weight: 900; }
.steps small { display: block; color: var(--muted); font-size: 13px; line-height: 1.5; }

.item { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.item h3 { margin: 0; font-size: 16px; font-weight: 700; }
.item p { margin: 0; font-size: 14px; color: var(--muted); }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); align-self: flex-start; letter-spacing: .06em; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 18px;
  border-radius: var(--radius); border: 0; background: var(--accent); color: var(--accent-ink);
  font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; align-self: flex-start;
}
.btn:focus-visible, .linkbtn:focus-visible, .field input:focus-visible, .field textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.notice { margin: 0; padding: 12px 14px; border-radius: var(--radius); background: var(--accent-soft); font-weight: 500; font-size: 15px; }

.formhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.linkbtn { background: none; border: 0; padding: 0 4px; min-height: 44px; font: inherit; font-size: 14px; color: var(--muted); text-decoration: underline; cursor: pointer; }

.warn { margin: 0; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--stamp); color: var(--stamp); font-size: 14px; font-weight: 500; line-height: 1.5; }
.form { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px 16px; display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lab { font-weight: 700; font-size: 15px; }
.field input[type="text"], .field input[type="date"], .field input[type="time"], .field textarea {
  width: 100%; min-height: 46px; padding: 9px 12px; font: inherit; color: var(--ink);
  background: var(--paper); border: 1.5px solid var(--rule); border-radius: 8px;
}
.field textarea { resize: vertical; min-height: 84px; }
.dates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dates label { font-weight: 500; font-size: 14px; color: var(--muted); }
@media (max-width: 420px) { .dates { grid-template-columns: 1fr; } }

.out { display: flex; flex-direction: column; gap: 12px; }
.out textarea {
  width: 100%; min-height: 190px; padding: 14px; font: 15px/1.7 var(--font-body); color: var(--ink);
  background: var(--card); border: 1.5px dashed var(--accent); border-radius: var(--radius); resize: vertical;
}
.out .btn { align-self: stretch; text-align: center; line-height: 1.45; padding-block: 12px; }
.copied { color: var(--ok); font-weight: 700; font-size: 14px; min-height: 1.5em; margin: 0; }

.finish { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--radius); background: var(--accent-soft); }
.stamp {
  flex: none; width: 64px; height: 64px; display: grid; place-items: center; text-align: center;
  border: 2.5px solid var(--stamp); color: var(--stamp); border-radius: 8px; transform: rotate(-6deg);
  font-weight: 900; font-size: 15px; line-height: 1.2; letter-spacing: .05em;
}
.finish p { margin: 0; font-weight: 500; }
</style>

<div class="wrap">
  <header>
    <p class="kicker">楠梓國小家長專用</p>
    <h1>🌸楠梓國小班級請假單🌸</h1>
    <p>由上往下填寫，直到最後一步完成，才算完整請假。</p>
  </header>

  <section aria-labelledby="h-type">
    <h2 id="h-type">請假類型</h2>
    <fieldset>
      <legend>假別</legend>
      <div class="seg seg3">
        <label><input type="radio" name="type" value="事假" checked><span><b class="ico" aria-hidden="true">🌱</b>事假</span></label>
        <label><input type="radio" name="type" value="病假"><span><b class="ico" aria-hidden="true">🌿</b>病假／一般病假</span></label>
        <label><input type="radio" name="type" value="公假"><span><b class="ico" aria-hidden="true">🌻</b>公假</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>請假天數</legend>
      <div class="seg seg3">
        <label><input type="radio" name="days" value="part"><span>未滿 1 日</span></label>
        <label><input type="radio" name="days" value="short" checked><span>1–2 天</span></label>
        <label><input type="radio" name="days" value="long"><span>3 天以上</span></label>
      </div>
    </fieldset>
    <fieldset id="feverSet" hidden>
      <legend>孩子有發燒，或確診腸病毒、流感、登革熱、諾羅、水痘或其他校園傳染病嗎？</legend>
      <div class="seg">
        <label><input type="radio" name="fever" value="no" checked><span>沒有</span></label>
        <label><input type="radio" name="fever" value="yes"><span>有（已發燒／已確診）</span></label>
      </div>
    </fieldset>
  </section>

  <section aria-labelledby="h-todo">
    <h2 id="h-todo">這次的流程<span class="count" id="count">1 項</span></h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <section aria-labelledby="h-form">
    <div class="formhead">
      <h2 id="h-form">請假資訊</h2>
      <button type="button" class="linkbtn" id="reset">清除重填</button>
    </div>
    <div class="form">
      <div class="field">
        <label for="who">座號／姓名</label>
        <input type="text" id="who" placeholder="例：30號 王小楠" autocomplete="off">
      </div>
      <div class="field">
        <span class="lab" id="dlab">請假日期</span>
        <div class="dates" role="group" aria-labelledby="dlab">
          <div class="field"><label for="d1" id="d1l">開始日</label><input type="date" id="d1"></div>
          <div class="field" id="d2wrap"><label for="d2">結束日（只請一天可不填）</label><input type="date" id="d2"></div>
        </div>
        <div class="dates" id="timeRow" role="group" aria-label="請假時間" hidden>
          <div class="field"><label for="t1">開始時間</label><input type="time" id="t1"></div>
          <div class="field"><label for="t2">結束時間</label><input type="time" id="t2"></div>
        </div>
        <p class="warn" id="dateWarn" role="status" hidden></p>
      </div>
      <fieldset class="field" id="reasonSet">
        <legend style="color:var(--ink);font-weight:700;font-size:15px">請假原因（可複選）</legend>
        <div class="seg" id="reasonChips"></div>
        <div class="field" id="otherWrap" hidden>
          <label for="why">其他原因說明（必填）</label>
          <textarea id="why" placeholder="請說明請假原因"></textarea>
        </div>
      </fieldset>
      <fieldset>
        <legend style="color:var(--ink);font-weight:700;font-size:15px">作業是否需要放警衛室</legend>
        <div class="seg">
          <label><input type="radio" name="hw" value="需要"><span>需要</span></label>
          <label><input type="radio" name="hw" value="不需要"><span>不需要</span></label>
        </div>
      </fieldset>
    </div>
  </section>

  <section class="out" aria-labelledby="h-out">
    <h2 id="h-out">傳給老師</h2>
    <p class="sub" id="outSub">內容會隨上方填寫即時更新。</p>
    <textarea id="msg" readonly aria-label="請假訊息預覽"></textarea>
    <button class="btn" id="copy" type="button">複製請假訊息，回到line貼給老師，請假才算完成！</button>
    <p class="copied" id="copied" role="status"></p>
  </section>

  <div class="finish">
    <div class="stamp" aria-hidden="true">家長<br>確認</div>
    <p id="finishText">複製請假訊息，回到line貼給老師，請假才算完成！謝謝 😊</p>
  </div>
</div>

<script>
(function () {
  var LUNCH_URL = "https://forms.gle/cLhvQWdKdwa3FSXm8";
  var REPORT_URL = "https://cpmimicker07-cloud.github.io/ntpshealth/";
  var KEY = "class209-leave-v2";
  var TTL = 24 * 60 * 60 * 1000;
  var state = { type: "事假", days: "short", fever: "no" };
  var OPTIONS = {
    "事假": ["家庭旅遊", "家中事務", "參加比賽或活動", "其他"],
    "病假": ["感冒", "發燒", "腸胃不適", "受傷", "回診或看醫生", "其他"],
    "公假": ["參加比賽或活動", "其他"]
  };
  var picked = [];
  var lastType = "";
  var $ = function (s) { return document.querySelector(s); };

  function radio(name) {
    var el = document.querySelector('input[name="' + name + '"]:checked');
    return el ? el.value : "";
  }
  function setRadio(name, val) {
    if (!val) return;
    var el = document.querySelector('input[name="' + name + '"][value="' + val + '"]');
    if (el) el.checked = true;
  }
  function fmt(v) {
    if (!v) return "";
    var p = v.split("-").map(Number);
    var w = "日一二三四五六"[new Date(p[0], p[1] - 1, p[2]).getDay()];
    return p[1] + "/" + p[2] + "（週" + w + "）";
  }
  function tfmt(v) { return v ? v.replace(/^0/, "") : ""; }
  function dateText() {
    if (state.days === "part") {
      var d = fmt($("#d1").value);
      var a1 = tfmt($("#t1").value), b1 = tfmt($("#t2").value);
      var tm = (a1 || b1) ? (a1 + "-" + b1) : "";
      return (d + " " + tm).trim();
    }
    var a = fmt($("#d1").value), b = fmt($("#d2").value);
    if (a && b && $("#d1").value !== $("#d2").value) return a + "～" + b;
    return a || b;
  }
  /* 國定假日（週一至週五的放假日，含補假）。依人事行政總處公告整理，校慶補假、寒暑假等校內假日未列入。 */
  var HOLIDAYS = {
    "2026-12-25": 1,
    "2027-01-01": 1, "2027-02-04": 1, "2027-02-05": 1, "2027-02-08": 1, "2027-02-09": 1, "2027-02-10": 1,
    "2027-03-01": 1, "2027-04-05": 1, "2027-04-06": 1, "2027-04-30": 1, "2027-06-09": 1,
    "2027-09-15": 1, "2027-09-28": 1, "2027-10-11": 1, "2027-10-25": 1, "2027-12-24": 1, "2027-12-31": 1
  };
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  /* 計算請假期間的上課日：排除週六、週日與國定假日 */
  function spanDays() {
    var a = $("#d1").value, b = $("#d2").value;
    if (!a || !b) return 0;
    var d = new Date(a + "T00:00:00"), end = new Date(b + "T00:00:00");
    var count = 0, guard = 0;
    while (d <= end && guard++ < 400) {
      var wd = d.getDay();
      var key = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      if (wd !== 0 && wd !== 6 && !HOLIDAYS[key]) count++;
      d.setDate(d.getDate() + 1);
    }
    return count;
  }
  /* 開始日、結束日都填了（且不是未滿一日）時，以日期算出的上課日為準，避免天數選錯 */
  function hasDates() {
    return state.days !== "part" && !!($("#d1").value && $("#d2").value);
  }
  function needs() {
    var span = hasDates() ? spanDays() : -1;
    return {
      paper: state.type === "事假" && (span >= 0 ? span > 5 : false) && state.days !== "part",
      lunch: state.days !== "part" && (span >= 0 ? span >= 3 : state.days === "long"),
      report: state.type === "病假" && state.fever === "yes"
    };
  }
  function readPicked() {
    picked = Array.prototype.map.call(document.querySelectorAll('input[name="reason"]:checked'), function (el) { return el.value; });
  }
  function renderReasons() {
    var opts = OPTIONS[state.type] || [];
    $("#reasonChips").innerHTML = opts.map(function (o) {
      return '<label><input type="checkbox" name="reason" value="' + o + '"' + (picked.indexOf(o) >= 0 ? " checked" : "") + '><span>' + (o === "其他" ? "其他(請說明)" : o) + '</span></label>';
    }).join("");
  }
  function reasonText() {
    var other = $("#why").value.trim();
    return picked.map(function (r) {
      return r === "其他" ? (other ? "其他（" + other + "）" : "其他") : r;
    }).join("、");
  }
  function daysLabel() {
    if (state.days === "part") return "未滿1日";
    if (hasDates()) return spanDays() >= 3 ? "3天以上" : "1-2天";
    return state.days === "long" ? "3天以上" : "1-2天";
  }

  /* 填過的內容暫存在這支手機上 24 小時，頁面重新載入也不會消失 */
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        ts: Date.now(),
        type: radio("type"), days: radio("days"), fever: radio("fever"), hw: radio("hw"),
        who: $("#who").value, d1: $("#d1").value, d2: $("#d2").value, t1: $("#t1").value, t2: $("#t2").value, why: $("#why").value, picked: picked
      }));
    } catch (e) {}
  }
  function restore() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (!s || !s.ts || Date.now() - s.ts > TTL) { localStorage.removeItem(KEY); return; }
      setRadio("type", s.type); setRadio("days", s.days); setRadio("fever", s.fever); setRadio("hw", s.hw);
      $("#who").value = s.who || "";
      $("#d1").value = s.d1 || "";
      $("#d2").value = s.d2 || "";
      $("#t1").value = s.t1 || "";
      $("#t2").value = s.t2 || "";
      $("#why").value = s.why || "";
      picked = Array.isArray(s.picked) ? s.picked.filter(function (x) { return typeof x === "string"; }) : [];
    } catch (e) {}
  }
  function reset() {
    try { localStorage.removeItem(KEY); } catch (e) {}
    ["#who", "#d1", "#d2", "#t1", "#t2", "#why"].forEach(function (s) { $(s).value = ""; });
    Array.prototype.forEach.call(document.querySelectorAll('input[type="radio"]'), function (r) { r.checked = r.defaultChecked; });
    picked = []; lastType = "";
    $("#copied").textContent = "";
    refresh();
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    $("#h-type").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  }

  function renderSteps() {
    var n = needs();
    var html = '<li>填寫請假資訊，複製後回到line貼給老師</li>';
    if (n.lunch) html += '<li>請填「午餐停餐申請」，並截圖傳給老師<small>請假 3 天以上需要，請於前一天中午 12:00 前提出。表單連結會附在複製的訊息裡，若有填報困難，請洽導師。</small></li>';
    if (n.report) html += '<li>最後填「校園傳染病通報系統」，並截圖傳給老師<small>有發燒或確診時需要。表單連結會附在複製的訊息裡，若有填報困難，請洽導師。</small></li>';
    if (n.paper) html += '<li class="star"><span class="mk" aria-hidden="true">*</span>事假超過 5 個上課日（共 ' + spanDays() + ' 天），另填紙本假單<small>上課日不含週末與國定假日。請洽導師拿紙本假單。</small></li>';
    else if (state.type === "事假" && state.days === "long") html += '<li class="star"><span class="mk" aria-hidden="true">*</span>若事假超過 5 個上課日，需另填紙本假單<small>上課日不含週末與國定假日。請洽導師拿紙本假單。填好日期後，這裡會自動計算。</small></li>';
    $("#steps").innerHTML = html;
    $("#count").textContent = (1 + (n.lunch ? 1 : 0) + (n.report ? 1 : 0) + (n.paper ? 1 : 0)) + " 項";
  }

  function buildMsg() {
    var n = needs();
    $("#why").classList.toggle("need", picked.indexOf("其他") >= 0 && !$("#why").value.trim());
    var head = "【" + state.type + "・" + daysLabel() + (n.report ? "・發燒/傳染病" : "") + "】";
    var lines = [
      head,
      "1.座號/姓名：" + $("#who").value.trim(),
      "2.請假日期：" + dateText(),
      "3.請假原因：" + reasonText(),
      "4.作業是否需要放警衛室：" + radio("hw")
    ];
    var todo = [];
    if (n.lunch) todo.push("「午餐停餐申請」");
    if (n.report) todo.push("「傳染病通報系統」");
    var blocks = [lines.join("\n")];
    if (todo.length) blocks.push("*另須填寫" + todo.join("及") + "，填完截圖給老師。");
    if (n.lunch) blocks.push("🌸「午餐停餐申請」 " + LUNCH_URL);
    if (n.report) blocks.push("🍃「傳染病通報系統」 " + REPORT_URL);
    if (n.paper) blocks.push("*事假超過5個上課日（共" + spanDays() + "天）：需另填紙本假單，請向導師領取。");
    $("#msg").value = blocks.join("\n\n");
    save();
  }

  function refresh() {
    state.type = radio("type");
    state.days = radio("days");
    state.fever = state.type === "病假" ? radio("fever") : "no";
    if (state.type !== lastType) {
      var first = lastType === "";
      lastType = state.type;
      if (first) picked = picked.filter(function (x) { return (OPTIONS[state.type] || []).indexOf(x) >= 0; });
      else { picked = []; $("#why").value = ""; }
      renderReasons();
    }
    $("#otherWrap").hidden = picked.indexOf("其他") < 0;
    $("#feverSet").hidden = state.type !== "病假";
    var part = state.days === "part";
    $("#timeRow").hidden = !part;
    $("#d2wrap").hidden = part;
    $("#d1l").textContent = part ? "請假日" : "開始日";
    var w = $("#dateWarn");
    var msgWarn = "";
    if (hasDates()) {
      var sp = spanDays();
      if (sp < 1) msgWarn = "結束日比開始日早，請檢查日期。";
      else if (state.days === "long" && sp < 3) msgWarn = "您選的是「3 天以上」，但日期只有 " + sp + " 個上課日（不含週末與國定假日），不需要填午餐停餐申請。如果天數選錯，請修改。";
      else if (state.days === "short" && sp >= 3) msgWarn = "您選的是「1–2 天」，但日期有 " + sp + " 個上課日（不含週末與國定假日），需要填午餐停餐申請。如果天數選錯，請修改。";
    }
    w.textContent = msgWarn;
    w.hidden = !msgWarn;
    var n = needs();
    var extra = n.lunch || n.report || n.paper;
    $("#finishText").textContent = extra
      ? "複製請假訊息，回到line貼給老師並附上表單截圖，請假才算完成！"
      : "複製請假訊息，回到line貼給老師，請假才算完成！謝謝 😊";
    $("#copy").textContent = extra
      ? "複製請假訊息，回到line貼給老師；請注意請假尚未完成！"
      : "複製請假訊息，回到line貼給老師，請假才算完成！";
    renderSteps();
    buildMsg();
  }

  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.matches('input[name="reason"]')) {
      readPicked();
      if (t.value === "發燒" && t.checked) setRadio("fever", "yes");
      refresh();
      return;
    }
    if (t.matches('input[name="type"], input[name="days"], input[name="fever"]')) { refresh(); return; }
    if (t.matches("#d1, #d2")) { refresh(); return; }
    if (t.matches('input[name="hw"], #t1, #t2')) buildMsg();
  });
  document.addEventListener("input", function (e) {
    if (e.target.matches("#who, #why")) buildMsg();
  });
  $("#reset").addEventListener("click", reset);

  $("#copy").addEventListener("click", function () {
    var ta = $("#msg"), out = $("#copied");
    if (picked.indexOf("其他") >= 0 && !$("#why").value.trim()) {
      out.textContent = "請先填寫「其他原因說明」，再複製請假訊息。";
      $("#why").focus();
      return;
    }
    var n = needs();
    function ok() {
      out.textContent = (n.lunch || n.report || n.paper)
        ? "已複製，請回到line貼給老師。請注意訊息內還有表單需要填寫，請假尚未完成！"
        : "已複製，請回到line貼給老師，請假才算完成！";
    }
    function fallback() {
      ta.focus(); ta.select();
      out.textContent = "請長按已選取的文字，選擇「拷貝」。";
    }
    try {
      navigator.clipboard.writeText(ta.value).then(ok, fallback);
    } catch (err) { fallback(); }
  });

  restore();
  refresh();
})();
</script>

</body></html>
